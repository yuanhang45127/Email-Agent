[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mailradar"
version = "0.1.0"
description = "Self-hosted mail automation & information-watch agent"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mailradar = "mailradar.cli:main"

[tool.setuptools]
packages = ["mailradar"]

[tool.setuptools.package-data]
mailradar = ["panel_index.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
